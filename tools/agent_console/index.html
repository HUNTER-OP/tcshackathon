<!doctype html>
<!--
  Hisab Kitab human agent console: live handoff queue, transcript, drafted reply, resolve.
  Usage: open index.html?api=http://10.127.10.203:8000  (or serve: python -m http.server 8090)
  Polls GET /tickets every 3 s and GET /metrics for the deflection rate. No LLM key in the browser.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisab Kitab Agent Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&display=swap" rel="stylesheet">
<script>
  // share the main app's theme choice (same origin), default to the OS setting
  (function () {
    var t = null; try { t = localStorage.getItem("hk-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root {
    --page: #2e6b43; --ground: #2e6b43; --surface: #ffffff; --surface-2: #f4f9f0; --surface-3: #dcf1cf;
    --line: #d3e0cd; --ink: #111111; --ink-2: #3b3b4f; --ink-3: #66726c;
    --mint: #5bc27e; --ok: #23874a; --bad: #c8382f; --bad-tint: #fde8e6;
    --shadow: 0 1px 2px rgba(17,40,25,.05), 0 8px 20px -12px rgba(17,40,25,.2);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --page: #0b1610; --ground: #2f7d4c; --surface: #14231a; --surface-2: #1a2d21; --surface-3: #21402c;
    --line: #2f4b3a; --ink: #eef6ea; --ink-2: #c6d5ca; --ink-3: #93a99b;
    --ok: #63d48f; --bad: #ff7b70; --bad-tint: #3a1d1b;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 24px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 12px;
    background: var(--page); color: var(--ink);
    font: 14px/1.5 "Inter", "Noto Sans Devanagari", "Noto Sans Kannada", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }
  header { display: flex; align-items: center; gap: 18px; padding: 12px 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo-tile { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; display: flex; }
  .logo-tile img { height: 30px; width: auto; mix-blend-mode: multiply; }
  .brand h1 { margin: 0; font: 600 18px/1.2 "Poppins", "Inter", sans-serif; letter-spacing: -.01em; }
  .brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-3); }
  .conn { font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
  .dot.on { background: var(--mint); } .dot.off { background: var(--bad); }
  .kpis { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .kpi { background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; min-width: 104px; }
  .kpi b { display: block; font: 700 19px/1.25 "Poppins", "Inter", sans-serif; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--ink-3); font-size: 11.5px; font-weight: 600; }
  .kpi.hero { background: var(--surface-3); border-color: var(--ground); }
  .kpi.hero b { color: var(--ok); }
  .icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .icon-btn:hover { background: var(--surface-3); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 12px; }
  #queue { overflow-y: auto; display: flex; flex-direction: column; }
  .qhead { display: flex; justify-content: space-between; align-items: center; padding: 16px 16px 10px; position: sticky; top: 0; background: var(--surface); z-index: 1; border-radius: 22px 22px 0 0; }
  .qhead h2 { margin: 0; font: 600 16px "Poppins", "Inter", sans-serif; }
  .qhead select { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 5px 8px; font: inherit; font-size: 13px; }
  #list { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .ticket { padding: 10px 12px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; transition: background .15s, border-color .15s; }
  .ticket:hover { background: var(--surface-2); }
  .ticket.sel { background: var(--surface-3); border-color: var(--ground); }
  .ticket .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ticket .who { font-weight: 600; }
  .ticket .age { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ticket .id { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .ticket .snip { color: var(--ink-2); font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 500; color: var(--ink-2); }
  .chip.high, .chip.negative { background: var(--bad-tint); border-color: transparent; color: var(--bad); }
  .chip.positive { background: var(--surface-3); border-color: transparent; color: var(--ok); }
  .empty { padding: 48px 20px; text-align: center; color: var(--ink-3); }
  #detail { overflow-y: auto; padding: 22px 26px; }
  #detail h2 { margin: 0 0 2px; font: 600 22px/1.25 "Poppins", "Inter", sans-serif; letter-spacing: -.01em; }
  #detail h2 .tid { color: var(--ink-3); font-weight: 500; font-size: 15px; margin-left: 8px; }
  .sub { color: var(--ink-3); margin-bottom: 18px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
  .summary { font-size: 14.5px; }
  .msg { padding: 8px 12px; border-radius: 14px; margin: 6px 0; max-width: 85%; white-space: pre-wrap; width: fit-content; }
  .msg.user { background: var(--ground); color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.assistant { background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .r { font-size: 11px; opacity: .75; display: block; margin-bottom: 1px; }
  dl { display: grid; grid-template-columns: 112px 1fr; gap: 8px 10px; margin: 0; font-size: 13.5px; }
  dt { color: var(--ink-3); } dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }
  textarea { width: 100%; min-height: 140px; background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--ground); }
  .actions { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  button.primary { background: var(--ground); color: #fff; border: 1px solid var(--ground); border-radius: 999px; padding: 8px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  button.primary:hover { filter: brightness(1.08); }
  button.ghost { background: var(--surface); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 8px 16px; font: inherit; font-weight: 500; cursor: pointer; }
  button.ghost:hover { background: var(--surface-2); }
  button:disabled { opacity: .5; cursor: default; }
  .toast { color: var(--ok); font-size: 13px; font-weight: 500; }
  .toast.err { color: var(--bad); }
  .hint { font-size: 12px; color: var(--ink-3); margin-top: 6px; }
  :focus-visible { outline: 2px solid var(--ground); outline-offset: 2px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } #queue { max-height: 40vh; } .kpis { margin-left: 0; } }
</style>
</head>
<body>
<header class="panel">
  <div class="brand">
    <span class="logo-tile"><img src="/logo.jpeg" alt="Hisab Kitab" onerror="this.parentNode.style.display='none'"></span>
    <div><h1>Agent console</h1><p>Every Rupee, Explained. · human handoff queue</p></div>
  </div>
  <div class="conn"><span id="dot" class="dot"></span><span id="conn">connecting…</span></div>
  <div class="kpis">
    <div class="kpi hero"><small>Resolved by AI</small><b id="k-defl">–</b></div>
    <div class="kpi"><small>Total queries</small><b id="k-total">–</b></div>
    <div class="kpi"><small>Handoffs</small><b id="k-hand">–</b></div>
    <div class="kpi"><small>Open tickets</small><b id="k-open">–</b></div>
    <div class="kpi"><small>Avg response</small><b id="k-lat">–</b></div>
  </div>
  <button class="icon-btn" id="theme" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
</header>
<main>
  <section id="queue" class="panel">
    <div class="qhead"><h2>Queue</h2>
      <select id="sort" aria-label="Sort tickets"><option value="priority">Priority first</option><option value="age">Oldest first</option></select>
    </div>
    <div id="list"><div class="empty">Loading tickets…</div></div>
  </section>
  <section id="detail" class="panel"><div class="empty">Select a ticket from the queue.</div></section>
</main>
<script>
const API = (new URLSearchParams(location.search).get("api") || (location.protocol.startsWith("http") ? location.origin : "http://localhost:8000")).replace(/\/$/, "");
const LANG = { en: "English", hi: "Hindi", kn: "Kannada", hinglish: "Hinglish" };
const PRI = { high: 0, normal: 1, low: 2 };
let tickets = [], customers = {}, selected = null, drafts = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inr = (n) => n == null ? "–" : "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });

// Backend timestamps are naive local time of the server (IST). Override with ?tz=+05:30
const SERVER_TZ = new URLSearchParams(location.search).get("tz") || "+05:30";
function parseTs(ts) {
  const s = String(ts || "");
  return new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(s) ? s : s + SERVER_TZ);
}

function fmtTime(ts) {
  const d = parseTs(ts); if (isNaN(d)) return String(ts || "");
  return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
}

function age(ts) {
  const t = parseTs(ts); if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  return Math.floor(s / 86400) + "d";
}

const TOPIC = {
  card_block: { en: "blocking your card", hi: "आपका कार्ड ब्लॉक करने", kn: "ನಿಮ್ಮ ಕಾರ್ಡ್ ಬ್ಲಾಕ್ ಮಾಡುವ", hinglish: "aapka card block karne" },
  dispute_refund: { en: "your dispute / refund", hi: "आपके डिस्प्यूट / रिफंड", kn: "ನಿಮ್ಮ ವಿವಾದ / ಮರುಪಾವತಿ", hinglish: "aapke dispute / refund" },
  loan_eligibility: { en: "your loan query", hi: "आपके लोन के सवाल", kn: "ನಿಮ್ಮ ಸಾಲದ ಪ್ರಶ್ನೆ", hinglish: "aapke loan query" },
  transfer_money: { en: "your transfer", hi: "आपके ट्रांसफर", kn: "ನಿಮ್ಮ ವರ್ಗಾವಣೆ", hinglish: "aapke transfer" },
  _default: { en: "your request", hi: "आपके अनुरोध", kn: "ನಿಮ್ಮ ವಿನಂತಿ", hinglish: "aapki request" },
};

function draftReply(t) {
  const lang = LANG[t.language] ? t.language : "en";
  const name = (customers[t.customer_id]?.name || "").split(" ")[0] || "";
  const topic = (TOPIC[t.intent_guess] || TOPIC._default)[lang];
  const upset = t.sentiment === "negative";
  const T = {
    en: `Hello ${name}, this is your Hisab Kitab support specialist (ticket ${t.ticket_id}).\n` +
        (upset ? "I'm sorry for the trouble you've faced, and thank you for your patience. " : "Thanks for reaching out. ") +
        `I've read your conversation about ${topic}, so you won't need to repeat anything.\n` +
        "[Resolution / next step here]\nIs there anything else I can help you with?",
    hi: `नमस्ते ${name} जी, मैं Hisab Kitab सहायता टीम से बात कर रहा/रही हूँ (टिकट ${t.ticket_id})।\n` +
        (upset ? "आपको हुई परेशानी के लिए हमें खेद है, धैर्य रखने के लिए धन्यवाद। " : "संपर्क करने के लिए धन्यवाद। ") +
        `मैंने ${topic} के बारे में आपकी बातचीत पढ़ ली है, आपको कुछ दोहराने की ज़रूरत नहीं है।\n` +
        "[समाधान / अगला कदम]\nक्या मैं आपकी और कोई मदद कर सकता/सकती हूँ?",
    kn: `ನಮಸ್ಕಾರ ${name}, ನಾನು Hisab Kitab ಸಹಾಯ ತಂಡದಿಂದ ಮಾತನಾಡುತ್ತಿದ್ದೇನೆ (ಟಿಕೆಟ್ ${t.ticket_id}).\n` +
        (upset ? "ನಿಮಗೆ ಆದ ತೊಂದರೆಗೆ ಕ್ಷಮಿಸಿ, ನಿಮ್ಮ ತಾಳ್ಮೆಗೆ ಧನ್ಯವಾದಗಳು. " : "ಸಂಪರ್ಕಿಸಿದ್ದಕ್ಕೆ ಧನ್ಯವಾದಗಳು. ") +
        `${topic} ಬಗ್ಗೆ ನಿಮ್ಮ ಸಂಭಾಷಣೆಯನ್ನು ಓದಿದ್ದೇನೆ, ನೀವು ಮತ್ತೆ ಹೇಳುವ ಅಗತ್ಯವಿಲ್ಲ.\n` +
        "[ಪರಿಹಾರ / ಮುಂದಿನ ಹಂತ]\nಇನ್ನೇನಾದರೂ ಸಹಾಯ ಬೇಕೇ?",
    hinglish: `Namaste ${name} ji, main Hisab Kitab support team se baat kar raha/rahi hoon (ticket ${t.ticket_id}).\n` +
        (upset ? "Aapko hui pareshani ke liye sorry, patience rakhne ke liye thank you. " : "Contact karne ke liye thank you. ") +
        `Maine ${topic} ke baare mein aapki chat padh li hai, aapko kuch repeat karne ki zarurat nahi.\n` +
        "[Resolution / next step]\nKya main aur kuch help kar sakta/sakti hoon?",
  };
  return T[lang];
}

function sorted() {
  const list = tickets.slice();
  if ($("sort").value === "age") list.sort((a, b) => parseTs(a.created_at) - parseTs(b.created_at));
  else list.sort((a, b) => (PRI[a.priority] ?? 1) - (PRI[b.priority] ?? 1) || parseTs(a.created_at) - parseTs(b.created_at));
  return list;
}

function renderQueue() {
  $("k-open").textContent = tickets.length;
  if (!tickets.length) { $("list").innerHTML = '<div class="empty">No open tickets. The bot is handling everything.</div>'; return; }
  $("list").innerHTML = sorted().map((t) => `
    <div class="ticket ${t.ticket_id === selected ? "sel" : ""}" data-id="${esc(t.ticket_id)}">
      <div class="row1"><span class="who">${esc(customers[t.customer_id]?.name || t.customer_id)}</span><span class="age">${age(t.created_at)} ago</span></div>
      <div class="id">${esc(t.ticket_id)} · ${esc(t.customer_id)}</div>
      <div class="snip">${esc(t.transcript?.filter((m) => m.role === "user").slice(-1)[0]?.content || t.summary)}</div>
      <div class="chips">
        <span class="chip ${esc(t.priority)}">${esc(t.priority)}</span>
        <span class="chip ${esc(t.sentiment)}">${esc(t.sentiment)}</span>
        <span class="chip">${esc(LANG[t.language] || t.language)}</span>
      </div>
    </div>`).join("");
  document.querySelectorAll(".ticket").forEach((el) => el.onclick = () => select(el.dataset.id));
}

function renderDetail() {
  const t = tickets.find((x) => x.ticket_id === selected);
  if (!t) { $("detail").innerHTML = '<div class="empty">Select a ticket from the queue.</div>'; return; }
  const c = customers[t.customer_id] || {};
  if (!(t.ticket_id in drafts)) drafts[t.ticket_id] = draftReply(t);
  const conf = typeof t.confidence === "number" ? (t.confidence * 100).toFixed(0) + "%" : "–";
  $("detail").innerHTML = `
    <h2>${esc(c.name || t.customer_id)}<span class="tid">${esc(t.ticket_id)}</span></h2>
    <div class="sub">Opened ${esc(fmtTime(t.created_at))} · ${age(t.created_at)} ago · ${esc(t.reason)}</div>
    <div class="grid">
      <div>
        <div class="card"><h3>AI summary</h3><div class="summary">${esc(t.summary)}</div>
          <div class="chips" style="margin-top:10px">
            <span class="chip ${esc(t.priority)}">priority: ${esc(t.priority)}</span>
            <span class="chip ${esc(t.sentiment)}">sentiment: ${esc(t.sentiment)}</span>
            <span class="chip">bot guess: ${esc(t.intent_guess)} (${conf})</span>
          </div></div>
        <div class="card"><h3>Transcript</h3>
          ${(t.transcript || []).map((m) => `<div class="msg ${m.role === "user" ? "user" : "assistant"}"><span class="r">${m.role === "user" ? "Customer" : "Bot"}</span>${esc(m.content)}</div>`).join("") || '<div class="hint">No transcript.</div>'}
        </div>
        <div class="card"><h3>Reply to customer (${esc(LANG[t.language] || t.language)})</h3>
          <textarea id="reply">${esc(drafts[t.ticket_id])}</textarea>
          <div class="hint">Drafted from a template using the summary, sentiment and language. Edit before sending.</div>
          <div class="actions">
            <button class="primary" id="resolve">Resolve &amp; send</button>
            <button class="ghost" id="redraft">Re-draft</button>
            <span id="toast" class="toast"></span>
          </div>
        </div>
      </div>
      <div>
        <div class="card"><h3>Customer</h3><dl>
          <dt>ID</dt><dd>${esc(t.customer_id)}</dd>
          <dt>Name</dt><dd>${esc(c.name || "–")}</dd>
          <dt>City</dt><dd>${esc(c.city || "–")}</dd>
          <dt>Language</dt><dd>${esc(LANG[c.preferred_language] || c.preferred_language || "–")}</dd>
          <dt>Monthly income</dt><dd>${inr(c.monthly_income)}</dd>
          <dt>Credit score</dt><dd>${esc(c.credit_score ?? "–")}</dd>
          <dt>Data consent</dt><dd style="color:${c.consent ? "var(--ok)" : "var(--bad)"}">${c.consent == null ? "–" : c.consent ? "Given" : "Not given"}</dd>
        </dl></div>
      </div>
    </div>`;
  $("reply").oninput = (e) => drafts[t.ticket_id] = e.target.value;
  $("redraft").onclick = () => { drafts[t.ticket_id] = draftReply(t); $("reply").value = drafts[t.ticket_id]; };
  $("resolve").onclick = () => resolve(t.ticket_id);
}

function select(id) { selected = id; renderQueue(); renderDetail(); }

async function resolve(id) {
  const btn = $("resolve"), toast = $("toast"), reply = $("reply").value.trim();
  if (!reply) { toast.className = "toast err"; toast.textContent = "Reply is empty."; return; }
  btn.disabled = true; toast.className = "toast"; toast.textContent = "Sending…";
  try {
    const r = await fetch(`${API}/tickets/${encodeURIComponent(id)}/resolve?reply=${encodeURIComponent(reply)}`, { method: "POST" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    toast.textContent = "Resolved ✓";
    delete drafts[id];
    tickets = tickets.filter((x) => x.ticket_id !== id);
    selected = sorted()[0]?.ticket_id || null;
    setTimeout(() => { renderQueue(); renderDetail(); poll(); }, 700);
  } catch (e) {
    toast.className = "toast err"; toast.textContent = "Failed: " + e.message; btn.disabled = false;
  }
}

function setConn(ok, msg) { $("dot").className = "dot " + (ok ? "on" : "off"); $("conn").textContent = msg; }

async function poll() {
  try {
    const r = await fetch(`${API}/tickets?status=open`);
    if (!r.ok) throw new Error("HTTP " + r.status);
    tickets = await r.json();
    setConn(true, `live · ${API.replace(/^https?:\/\//, "")}`);
    if (selected && !tickets.some((t) => t.ticket_id === selected)) selected = null;
    if (!selected && tickets.length) selected = sorted()[0].ticket_id;
    renderQueue();
    // only re-render detail if the user isn't typing in it
    if (document.activeElement?.id !== "reply") renderDetail();
  } catch (e) { setConn(false, "offline: " + e.message); }
  try {
    const m = await (await fetch(`${API}/metrics`)).json();
    const total = m.total || 0, hand = m.handoffs || 0;
    $("k-total").textContent = total;
    $("k-hand").textContent = hand;
    $("k-defl").textContent = total ? ((1 - hand / total) * 100).toFixed(1) + "%" : "–";
    $("k-lat").textContent = m.avg_latency_ms != null ? (m.avg_latency_ms / 1000).toFixed(2) + " s" : "–";
  } catch (e) { /* metrics optional */ }
}

async function loadCustomers() {
  try { (await (await fetch(`${API}/customers`)).json()).forEach((c) => customers[c.id] = c); } catch (e) {}
}

$("sort").onchange = renderQueue;
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function paintTheme() { $("theme").innerHTML = document.documentElement.dataset.theme === "dark" ? SUN : MOON; }
$("theme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("hk-theme", next); } catch (e) {}
  paintTheme();
};
paintTheme();
loadCustomers().then(poll);
setInterval(poll, 3000);
setInterval(() => document.querySelectorAll(".ticket .age").length && renderQueue(), 30000);
</script>
</body>
</html>
